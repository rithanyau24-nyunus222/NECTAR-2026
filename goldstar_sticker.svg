<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <!-- 3D Shiny Gold Star Sticker Matching Reference -->
  <defs>
    <filter id="star-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="5" stdDeviation="0" flood-color="#1e293b" flood-opacity="0.2" />
    </filter>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#facc15" />
      <stop offset="70%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
  </defs>

  <g filter="url(#star-shadow)">
    <!-- White Sticker Outline -->
    <path d="M 60 10 L 73 42 L 108 45 L 81 68 L 89 102 L 60 84 L 31 102 L 39 68 L 12 45 L 47 42 Z" 
          fill="#ffffff" stroke="#1e293b" stroke-width="7" stroke-linejoin="round" />
    
    <!-- Gold Star Body -->
    <path d="M 60 14 L 72 43 L 104 46 L 79 67 L 86 98 L 60 81 L 34 98 L 41 67 L 16 46 L 48 43 Z" 
          fill="url(#gold-grad)" stroke="#a16207" stroke-width="2.5" stroke-linejoin="round" />

    <!-- 3D Facet Highlight -->
    <polygon points="60,14 60,81 72,43" fill="#fef9c3" opacity="0.8" />
    <polygon points="60,81 86,98 79,67" fill="#fef08a" opacity="0.6" />
    <polygon points="60,81 34,98 41,67" fill="#b45309" opacity="0.3" />

    <!-- Sparkle Gleam -->
    <circle cx="56" cy="34" r="3" fill="#ffffff" />
  </g>
</svg>
