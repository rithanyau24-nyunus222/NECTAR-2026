<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <!-- Cute Teh Tarik / Boba Cup Sticker -->
  <defs>
    <filter id="drink-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="3" dy="5" stdDeviation="0" flood-color="#334155" flood-opacity="0.18" />
    </filter>
  </defs>

  <g filter="url(#drink-shadow)">
    <!-- White Sticker Cutout Border -->
    <path d="M 45 40 L 115 40 L 102 135 C 100 142 94 148 85 148 L 75 148 C 66 148 60 142 58 135 Z" 
          fill="#ffffff" stroke="#1e293b" stroke-width="8" stroke-linejoin="round" />
    
    <!-- Cup Body (Clear Plastic / Warm Milk Tea Hue) -->
    <path d="M 48 45 L 112 45 L 100 132 C 99 138 94 142 86 142 L 74 142 C 66 142 61 138 60 132 Z" 
          fill="#fed7aa" stroke="#c2410c" stroke-width="3.5" />
    
    <!-- Milk Foam Layer -->
    <path d="M 48 45 L 112 45 L 110 65 Q 80 72 50 65 Z" fill="#ffffff" />
    
    <!-- Tapioca Pearls / Brown Sugar Pearls at Bottom -->
    <circle cx="68" cy="130" r="5" fill="#451a03" />
    <circle cx="80" cy="132" r="5.5" fill="#451a03" />
    <circle cx="92" cy="130" r="5" fill="#451a03" />
    <circle cx="74" cy="122" r="5" fill="#451a03" />
    <circle cx="86" cy="123" r="5" fill="#451a03" />

    <!-- Cute Happy Eyes & Blush on Cup -->
    <ellipse cx="68" cy="90" rx="3.5" ry="4.5" fill="#1e293b" />
    <ellipse cx="92" cy="90" rx="3.5" ry="4.5" fill="#1e293b" />
    <ellipse cx="61" cy="94" rx="4" ry="2.5" fill="#fda4af" />
    <ellipse cx="99" cy="94" rx="4" ry="2.5" fill="#fda4af" />
    <path d="M 77 93 Q 80 98 83 93" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" />

    <!-- Striped Straw -->
    <rect x="75" y="10" width="10" height="42" rx="3" fill="#f43f5e" transform="rotate(-12 80 30)" stroke="#1e293b" stroke-width="2.5" />
    <path d="M 73 18 L 83 16 M 75 26 L 85 24 M 77 34 L 87 32" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" transform="rotate(-12 80 30)" />

    <!-- Cup Dome Lid -->
    <path d="M 42 45 C 42 35 55 30 80 30 C 105 30 118 35 118 45 Z" fill="#bae6fd" stroke="#0284c7" stroke-width="3" />
  </g>
</svg>
