<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <!-- Cute Singapore Kaya Toast & Soft Boiled Eggs Sticker -->
  <defs>
    <filter id="toast-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="3" dy="5" stdDeviation="0" flood-color="#334155" flood-opacity="0.18" />
    </filter>
  </defs>

  <g filter="url(#toast-shadow)">
    <!-- White Sticker Outline -->
    <path d="M 24 65 C 24 55 35 45 50 45 L 95 45 C 108 45 118 55 118 68 L 118 115 C 118 128 108 138 95 138 L 45 138 C 32 138 24 128 24 115 Z" 
          fill="#ffffff" stroke="#1e293b" stroke-width="7" stroke-linejoin="round" />
    
    <!-- Plate / Tray -->
    <rect x="28" y="115" width="105" height="20" rx="8" fill="#fbcfe8" stroke="#be185d" stroke-width="3" />
    
    <!-- Bottom Toast Slice (Warm Golden Brown) -->
    <rect x="36" y="78" width="70" height="38" rx="7" fill="#fed7aa" stroke="#b45309" stroke-width="3.5" />
    
    <!-- Pandan Kaya Layer (Matcha Green) -->
    <rect x="40" y="74" width="62" height="7" rx="3" fill="#86efac" />
    
    <!-- Cold Butter Slab (Sunny Butter Yellow) -->
    <rect x="52" y="65" width="22" height="12" rx="3" fill="#fde047" stroke="#ca8a04" stroke-width="2.5" />
    <rect x="80" y="67" width="18" height="10" rx="3" fill="#fde047" stroke="#ca8a04" stroke-width="2.5" />
    
    <!-- Top Toast Slice -->
    <rect x="34" y="52" width="72" height="16" rx="6" fill="#fde68a" stroke="#b45309" stroke-width="3.5" />
    
    <!-- Cute Happy Face on Toast -->
    <circle cx="58" cy="94" r="3.5" fill="#1e293b" />
    <circle cx="82" cy="94" r="3.5" fill="#1e293b" />
    <ellipse cx="50" cy="98" rx="4" ry="2.5" fill="#f43f5e" />
    <ellipse cx="90" cy="98" rx="4" ry="2.5" fill="#f43f5e" />
    <!-- Smile -->
    <path d="M 66 98 Q 70 104 74 98" fill="none" stroke="#1e293b" stroke-width="3" stroke-linecap="round" />

    <!-- Soft Boiled Egg Saucer on the right -->
    <ellipse cx="120" cy="100" rx="22" ry="14" fill="#ffffff" stroke="#1e293b" stroke-width="4" />
    <ellipse cx="118" cy="99" rx="16" ry="10" fill="#fef08a" />
    <circle cx="118" cy="98" r="6" fill="#f97316" />
    <!-- Pepper specks -->
    <circle cx="114" cy="94" r="1" fill="#475569" />
    <circle cx="124" cy="95" r="1.2" fill="#475569" />
    <circle cx="120" cy="103" r="1" fill="#475569" />
  </g>
</svg>
