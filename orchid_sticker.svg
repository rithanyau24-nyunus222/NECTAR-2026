<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" width="100%" height="100%">
  <!-- Singapore Orchid Flower Sticker (Vanda Miss Joaquim) -->
  <defs>
    <filter id="orchid-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="3" dy="4" stdDeviation="0" flood-color="#334155" flood-opacity="0.16" />
    </filter>
  </defs>

  <g filter="url(#orchid-shadow)">
    <!-- White Sticker Outline -->
    <path d="M 70 12 C 55 12 40 28 45 50 C 25 50 12 70 20 90 C 28 110 50 115 65 110 C 70 125 90 130 105 118 C 122 105 125 80 115 65 C 125 45 110 25 90 28 C 82 16 75 12 70 12 Z" 
          fill="#ffffff" stroke="#1e293b" stroke-width="7" stroke-linejoin="round" />
    
    <!-- Top Petals (Soft Lavender Lilac) -->
    <ellipse cx="70" cy="38" rx="20" ry="26" fill="#e9d5ff" stroke="#a855f7" stroke-width="3" />
    <ellipse cx="42" cy="62" rx="22" ry="18" fill="#f3e8ff" stroke="#a855f7" stroke-width="3" />
    <ellipse cx="98" cy="62" rx="22" ry="18" fill="#f3e8ff" stroke="#a855f7" stroke-width="3" />
    
    <!-- Lower Lateral Sepals (Pink / Magenta) -->
    <ellipse cx="50" cy="94" rx="24" ry="20" fill="#f472b6" stroke="#db2777" stroke-width="3" />
    <ellipse cx="90" cy="94" rx="24" ry="20" fill="#f472b6" stroke="#db2777" stroke-width="3" />
    
    <!-- Center Orchid Lip (Vibrant Golden Amber & Ruby Red) -->
    <path d="M 70 65 C 60 65 56 78 62 90 C 68 100 72 100 78 90 C 84 78 80 65 70 65 Z" fill="#fbbf24" stroke="#d97706" stroke-width="2.5" />
    <ellipse cx="70" cy="74" rx="6" ry="7" fill="#dc2626" />
    <circle cx="70" cy="70" r="3" fill="#fef08a" />
  </g>
</svg>
